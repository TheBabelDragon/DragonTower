const FIXED_AUDIO="let ac=null,masterGain=null,sfxVol=.85,sfxOn=true;\nfunction ensureAudio(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext);masterGain=ac.createGain();masterGain.gain.value=1;masterGain.connect(ac.destination)}if(ac.state===\"suspended\")ac.resume().catch(()=>{})}catch(e){}return ac}\nfunction unlockAudio(){ensureAudio()}\n[\"pointerdown\",\"keydown\",\"touchstart\",\"click\"].forEach(ev=>addEventListener(ev,unlockAudio,{passive:true}));\nfunction tone(f,d,type=\"square\",v=.08,f2){if(!sfxOn)return;const ctx=ensureAudio();if(!ctx)return;try{const t0=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(Math.max(20,f),t0);if(f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t0+Math.max(.01,d));const vol=Math.max(.001,v*sfxVol);g.gain.setValueAtTime(vol,t0);g.gain.exponentialRampToValueAtTime(.001,t0+Math.max(.02,d));o.connect(g);g.connect(masterGain||ctx.destination);o.start(t0);o.stop(t0+Math.max(.03,d)+.02)}catch(e){}}\nfunction blip(notes){let t=0;for(const n of notes){const[f,d,type,v,f2]=n;setTimeout(()=>tone(f,d,type||\"square\",v||.08,f2),t*1000);t+=d*.85}}\nfunction landSound(hard){tone(hard?90:170,hard?.14:.1,\"triangle\",hard?.12:.09)}\nfunction jumpSound(){tone(320,.1,\"square\",.09,620)}\nfunction recordSound(){blip([[660,.12,\"triangle\",.12,900],[880,.14,\"triangle\",.1,1200],[1100,.18,\"sine\",.08,1400]])}\nfunction fallSound(){tone(720,1.5,\"sawtooth\",.1,40)}\nfunction milestoneSound(){blip([[520,.1,\"triangle\",.1,700],[780,.12,\"triangle\",.09,1000],[1040,.16,\"sine\",.08,1300]])}\nfunction crumbleSound(){tone(160,.32,\"sawtooth\",.09,50)}\nfunction bounceSound(){tone(450,.1,\"square\",.1,780)}\nfunction collapseWarnSound(){tone(100,.55,\"sawtooth\",.12,30);setTimeout(()=>tone(80,.4,\"sawtooth\",.1,25),200)}\nfunction orbSound(){tone(920,.09,\"sine\",.1,1600)}\nfunction napSound(){blip([[280,.18,\"triangle\",.08,200],[220,.2,\"sine\",.06,160]])}\nfunction checkSound(){blip([[400,.1,\"triangle\",.1,650],[600,.12,\"triangle\",.09,900],[800,.14,\"sine\",.08,1100]])}\n";
const FIXED_INPUT="const K={l:0,r:0,j:0};let jPressed=false;\nconst held={l:null,r:null,j:null};\nconst map={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j'};\nconst btnEls={l:document.getElementById('L'),r:document.getElementById('R'),j:document.getElementById('J')};\nfunction setKey(k,on){K[k]=on?1:0;const el=btnEls[k];if(el)el.classList.toggle('on',!!on)}\nfunction clearKeys(){for(const k of['l','r','j']){held[k]=null;setKey(k,false)}jPressed=false}\nfunction releasePointer(pid){if(pid==null)return;for(const k of['l','r','j']){if(held[k]===pid){held[k]=null;setKey(k,false)}}}\naddEventListener('keydown',e=>{if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();togglePause();return}if(Run.paused)return;const k=map[e.code];if(k){setKey(k,true);if(k==='j'&&!e.repeat)jPressed=true;e.preventDefault()}});\naddEventListener('keyup',e=>{const k=map[e.code];if(k){setKey(k,false);e.preventDefault()}});\naddEventListener('blur',clearKeys);\ndocument.addEventListener('visibilitychange',()=>{if(document.hidden){clearKeys();if(Run.state==='play'&&!Run.paused)togglePause(true)}});\naddEventListener('pointerup',e=>releasePointer(e.pointerId),true);\naddEventListener('pointercancel',e=>releasePointer(e.pointerId),true);\naddEventListener('touchend',e=>{for(const t of e.changedTouches)releasePointer(t.identifier)},true);\naddEventListener('touchcancel',e=>{for(const t of e.changedTouches)releasePointer(t.identifier)},true);\nfor(const[id,k]of[['L','l'],['R','r'],['J','j']]){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{if(Run.paused||Run.state==='title')return;e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(_){}held[k]=e.pointerId;setKey(k,true);if(k==='j')jPressed=true});el.addEventListener('pointerup',e=>{releasePointer(e.pointerId);e.preventDefault()});el.addEventListener('pointercancel',e=>{releasePointer(e.pointerId)});el.addEventListener('lostpointercapture',e=>{releasePointer(e.pointerId)})}\n['gesturestart','gesturechange','gestureend','dblclick'].forEach(ev=>addEventListener(ev,e=>e.preventDefault(),{passive:false}));\ndocument.addEventListener('touchmove',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});\n";
