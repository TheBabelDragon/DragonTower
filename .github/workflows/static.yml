# Deploys the ./site folder to GitHub Pages on every push to main.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  # Lets you run it manually from the Actions tab.
  workflow_dispatch:

# Least privilege required by the Pages deploy action.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; never cancel one mid-publish.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site folder
        uses: actions/upload-pages-artifact@v3
        with:
          path: "site"

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
